/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(str) {

    return str.replace(
        /[&<>"']/g,

        c => ({

            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;'

        }[c])

    );

}



/* =========================
   BUILD READER
========================= */

function buildReader() {


    speechSynthesis.cancel();

    clearInterval(timer);


    const text =
        $('text').value;


    const regex =
        /\S+/g;


    let match;

    let last = 0;

    let output = "";


    words = [];

    bounds = [];



    while (
        (match = regex.exec(text))
    ) {


        output +=
            escapeHTML(
                text.slice(
                    last,
                    match.index
                )
            );


        const index =
            words.length;


        words.push(
            match[0]
        );


        bounds.push([

            match.index,

            match.index +
            match[0].length

        ]);



        output +=

            `<span
                class="word"
                data-index="${index}"
                onclick="speakWord(${index})">

                ${escapeHTML(
                    match[0]
                )}

            </span>`;


        last =
            match.index +
            match[0].length;

    }



    output +=
        escapeHTML(
            text.slice(last)
        );


    $('reader').innerHTML =
        output;


    current = -1;

}



/* =========================
   HIGHLIGHT
========================= */

function highlightWord(index) {


    if (
        index < 0 ||
        index >= words.length
    ) {

        return;

    }


    document
        .querySelectorAll('.word')
        .forEach(
            (element, i) => {


                element.classList.toggle(
                    'done',
                    i < index
                );


                element.classList.toggle(
                    'current',
                    i === index
                );


                if (
                    i !== index
                ) {

                    element.classList.remove(
                        'clicked'
                    );

                }

            }
        );


    current =
        index;


    $('status').textContent =
        '▶︎ ' +
        words[index];

}



/* =========================
   FIND WORD
========================= */

function findWordFromCharacter(
    charIndex
) {


    for (
        let i = 0;
        i < bounds.length;
        i++
    ) {


        if (

            charIndex >=
            bounds[i][0]

            &&

            charIndex <
            bounds[i][1]

        ) {

            return i;

        }

    }


    return -1;

}



/* =========================
   FALLBACK
========================= */

function fallbackHighlight() {


    clearInterval(timer);


    const wordCount =
        words.length;


    const rate =
        Number(
            $('speed').value
        );


    const interval =
        Math.max(
            90,
            Math.round(
                360 / rate
            )
        );


    let index = 0;


    timer =
        setInterval(
            () => {


                if (
                    !speechSynthesis.speaking
                ) {

                    clearInterval(timer);

                    return;

                }


                highlightWord(index);


                index++;


                if (
                    index >=
                    wordCount
                ) {

                    clearInterval(timer);

                }

            },
            interval
        );

}



/* =========================
   WORD INFO
========================= */

function getWordKey(word) {


    return word
        .toLowerCase()
        .replace(
            /[.,!?;:"'()]/g,
            ""
        );

}



/* =========================
   OPEN WORD MODAL
========================= */

function openWordInfo(index) {


    const originalWord =
        words[index];


    if (!originalWord) {

        return;

    }


    selectedWord =
        originalWord;



    const key =
        getWordKey(
            originalWord
        );


    const data =
        wordData[key];



    /*
       클릭 단어 강조
    */

    document
        .querySelectorAll('.word')
        .forEach(
            element => {

                element.classList.remove(
                    'clicked'
                );

            }
        );


    const element =
        document.querySelector(
            `[data-index="${index}"]`
        );


    if (element) {

        element.classList.add(
            'clicked'
        );

    }



    /*
       기본값
    */

    $('modalWord').textContent =
        originalWord;



    if (data) {


        $('modalIPA').textContent =
            data.ipa;


        $('modalPart').textContent =
            data.part;


        $('modalMeaning').textContent =
            data.meaning;


        $('modalExample').textContent =
            data.example;


        $('modalExampleKo').textContent =
            data.exampleKo;


    }

    else {


        /*
           아직 사전에 없는 단어
        */

        $('modalIPA').textContent =
            "IPA 정보 준비 중";


        $('modalPart').textContent =
            "word";


        $('modalMeaning').textContent =
            "단어 정보 준비 중";


        $('modalExample').textContent =
            originalWord;


        $('modalExampleKo').textContent =
            "이 단어는 아직 K-ICTC 사전에 등록되지 않았습니다.";

    }



    $('wordModal')
        .classList
        .add('show');

}



/* =========================
   SPEAK WORD
========================= */

function speakWord(index) {


    const word =
        words[index];


    if (!word) {

        return;

    }


    /*
       기존 음성 중지
    */

    speechSynthesis.cancel();

    clearInterval(timer);



    /*
       단어 정보 표시
    */

    openWordInfo(index);



    /*
       단어 발음
    */

    const wordUtterance =
        new SpeechSynthesisUtterance(
            word
        );


    wordUtterance.lang =
        "en-US";


    wordUtterance.rate =
        0.72;


    wordUtterance.pitch =
        1;


    wordUtterance.onstart =
        () => {

            $('status').textContent =
                '🔊 ' +
                word;

        };


    wordUtterance.onend =
        () => {

            $('status').textContent =
                '✓ ' +
                word;

        };


    speechSynthesis.speak(
        wordUtterance
    );

}



/* =========================
   MODAL PLAY BUTTON
========================= */

$('modalPlay').onclick =
    () => {


        if (!selectedWord) {

            return;

        }


        speechSynthesis.cancel();


        const utterance =
            new SpeechSynthesisUtterance(
                selectedWord
            );


        utterance.lang =
            "en-US";


        utterance.rate =
            0.72;


        speechSynthesis.speak(
            utterance
        );

    };



/* =========================
   CLOSE MODAL
========================= */

$('closeModal').onclick =
    () => {

        $('wordModal')
            .classList
            .remove('show');

    };



/*
   팝업 바깥 클릭
*/

$('wordModal').onclick =
    () => {

        $('wordModal')
            .classList
            .remove('show');

    };



/* =========================
   FULL SENTENCE
========================= */

function startSpeaking() {


    speechSynthesis.cancel();

    clearInterval(timer);


    buildReader();


    const text =
        $('text')
            .value
            .trim();


    if (!text) {

        return;

    }


    utterance =
        new SpeechSynthesisUtterance(
            text
        );


    utterance.lang =
        "en-US";


    utterance.rate =
        Number(
            $('speed').value
        );


    utterance.pitch =
        1;


    utterance.onstart =
        () => {

            $('status').textContent =
                "재생 중…";


            fallbackHighlight();

        };


    utterance.onboundary =
        event => {


            if (
                typeof event.charIndex ===
                "number"
            ) {


                const index =
                    findWordFromCharacter(
                        event.charIndex
                    );


                highlightWord(
                    index
                );

            }

        };


    utterance.onend =
        () => {


            clearInterval(timer);


            document
                .querySelectorAll('.word')
                .forEach(
                    element => {

                        element.classList.remove(
                            'current'
                        );

                        element.classList.add(
                            'done'
                        );

                    }
                );


            $('status').textContent =
                "완료";

        };


    utterance.onerror =
        event => {

            $('status').textContent =
                "음성 재생 오류: " +
                (
                    event.error ||
                    "unknown"
                );

        };


    speechSynthesis.speak(
        utterance
    );

}



/* =========================
   PLAY
========================= */

$('play').onclick =
    () => {


        if (

            speechSynthesis.speaking
            &&
            speechSynthesis.paused

        ) {


            speechSynthesis.resume();


            $('status').textContent =
                "재생 중…";


            return;

        }


        startSpeaking();

    };



/* =========================
   PAUSE
========================= */

$('pause').onclick =
    () => {


        if (
            speechSynthesis.speaking
        ) {


            speechSynthesis.pause();


            $('status').textContent =
                "일시정지";

        }

    };



/* =========================
   STOP
========================= */

$('stop').onclick =
    () => {


        speechSynthesis.cancel();


        clearInterval(timer);


        buildReader();


        $('status').textContent =
            "정지";

    };



/* =========================
   SPEED
========================= */

$('speed').oninput =
    () => {


        $('sv').textContent =

            Number(
                $('speed').value
            ).toFixed(2)

            +

            "×";

    };



/* =========================
   TEXT CHANGE
========================= */

$('text').oninput =
    () => {


        speechSynthesis.cancel();


        clearInterval(timer);


        buildReader();


        $('status').textContent =
            "준비됨";

    };



/* =========================
   INITIALIZE
========================= */

buildReader();

</script>

</body>

</html>
