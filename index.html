<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<meta name="theme-color"
content="#0b1220">

<title>K-ICTC Speaking Reader</title>


<style>

/* =========================
   BASIC
========================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0b1220;
    color: #f8fafc;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        sans-serif;
}

button {
    border: 0;
    border-radius: 12px;
    min-height: 44px;
    padding: 0 15px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
}

.dark {
    background: #263244;
    color: white;
}

.green {
    background: #22c55e;
    color: #052e16;
}


/* =========================
   HEADER
========================= */

.header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 18px;
}

.header-left {
    display: flex;
    gap: 10px;
    align-items: flex-start;
}

.menu-button {
    width: 44px;
    padding: 0;
    font-size: 21px;
}

h1 {
    font-size: 24px;
    margin: 0 0 5px;
}

.sub {
    color: #94a3b8;
    font-size: 13px;
}

.version {
    font-size: 11px;
    color: #86efac;
    background: #0f2a1a;
    border: 1px solid #166534;
    padding: 6px 9px;
    border-radius: 20px;
}


/* =========================
   SIDE MENU
========================= */

.menu-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.55);
    z-index: 900;
}

.menu-overlay.show {
    display: block;
}

.side-menu {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;

    width: 285px;

    background: #111827;

    border-right:
        1px solid #334155;

    z-index: 1000;

    transform:
        translateX(-100%);

    transition:
        transform .22s ease;

    padding:
        calc(22px + env(safe-area-inset-top))
        16px 20px;
}

.side-menu.show {
    transform:
        translateX(0);
}

.menu-title {
    font-size: 20px;
    font-weight: 800;
    margin-bottom: 5px;
}

.menu-version {
    color: #64748b;
    font-size: 12px;
    margin-bottom: 25px;
}

.menu-item {
    width: 100%;
    min-height: 52px;

    background: transparent;
    color: #e2e8f0;

    text-align: left;

    margin-bottom: 7px;
}

.menu-item.active {
    background: #1e293b;
    color: #86efac;
}

.menu-item span {
    margin-right: 8px;
}


/* =========================
   MAIN
========================= */

main {
    max-width: 720px;
    margin: auto;

    padding:
        calc(18px + env(safe-area-inset-top))
        16px
        calc(30px + env(safe-area-inset-bottom));
}


/* =========================
   PAGES
========================= */

.page {
    display: none;
}

.page.active {
    display: block;
}


/* =========================
   INPUT
========================= */

.input-tools {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin: 10px 0;
}

textarea {
    width: 100%;
    min-height: 145px;

    border:
        1px solid #334155;

    border-radius: 16px;

    background: #111827;

    color: white;

    padding: 15px;

    font-size: 18px;

    line-height: 1.55;

    outline: none;
}

textarea:focus {
    border-color: #22c55e;
}

.char-count {
    text-align: right;
    color: #64748b;
    font-size: 12px;
    margin-top: 5px;
}

.char-count.warning {
    color: #facc15;
}

.char-count.error {
    color: #ef4444;
}


/* =========================
   CONTROLS
========================= */

.row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin: 12px 0;
}

.control {
    background: #111827;
    border: 1px solid #334155;
    border-radius: 14px;
    padding: 12px 14px;
    margin: 10px 0;
}

.speedline {
    display: flex;
    justify-content: space-between;
    margin-bottom: 7px;
    color: #cbd5e1;
}

input[type="range"] {
    width: 100%;
    accent-color: #22c55e;
}


/* =========================
   READER
========================= */

.reader {
    margin-top: 14px;

    background: #111827;

    border:
        1px solid #334155;

    border-radius: 18px;

    padding: 18px;

    min-height: 190px;

    font-size: 25px;

    line-height: 1.9;
}

.word {
    display: inline-block;

    margin-right: .12em;

    padding: 0 .08em;

    border-radius: 7px;

    cursor: pointer;

    user-select: none;

    transition: .08s;
}

.word.done {
    color: #86efac;
}

.word.current {
    background: #22c55e;
    color: #052e16;
}

.word.clicked {
    background: #facc15;
    color: #422006;
}

.status {
    color: #94a3b8;
    font-size: 13px;
    margin: 10px 3px;
}

.note {
    font-size: 13px;
    line-height: 1.55;

    color: #cbd5e1;

    background: #0f2a1a;

    border-left:
        4px solid #22c55e;

    padding: 12px;

    border-radius: 9px;

    margin-top: 14px;
}


/* =========================
   SAVE BUTTON
========================= */

.save-button {
    width: 100%;
    margin-top: 10px;

    background: #334155;
    color: white;
}

.save-button.saved {
    background: #14532d;
    color: #86efac;
}


/* =========================
   SENTENCE STORAGE
========================= */

.storage-title {
    font-size: 25px;
    font-weight: 800;
    margin-bottom: 5px;
}

.storage-sub {
    color: #94a3b8;
    font-size: 13px;
    margin-bottom: 18px;
}

.empty {
    text-align: center;
    padding: 50px 20px;

    color: #64748b;

    background: #111827;

    border:
        1px solid #334155;

    border-radius: 18px;
}

.sentence-card {
    background: #111827;

    border:
        1px solid #334155;

    border-radius: 16px;

    padding: 15px;

    margin-bottom: 10px;
}

.sentence-text {
    font-size: 17px;
    line-height: 1.55;
    margin-bottom: 12px;
}

.sentence-buttons {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
}

.sentence-buttons button {
    min-height: 38px;
    font-size: 13px;
}


/* =========================
   MODAL
========================= */

.modal {
    display: none;

    position: fixed;

    inset: 0;

    background:
        rgba(0,0,0,.68);

    z-index: 1100;

    align-items: flex-end;

    justify-content: center;

    padding: 12px;
}

.modal.show {
    display: flex;
}

.modal-card {
    width: 100%;
    max-width: 650px;

    background: #111827;

    border:
        1px solid #334155;

    border-radius: 24px;

    padding: 22px;
}

.modal-top {
    display: flex;
    justify-content: space-between;
}

.modal-word {
    font-size: 32px;
    font-weight: 800;
}

.close {
    width: 38px;
    min-height: 38px;
    padding: 0;
    border-radius: 50%;
}

.pronunciation {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 10px 0;
}

.ipa {
    color: #86efac;
    font-size: 20px;
}

.part {
    display: inline-block;

    background: #263244;

    color: #cbd5e1;

    padding: 5px 9px;

    border-radius: 8px;

    font-size: 13px;
}

.meaning {
    font-size: 22px;
    font-weight: 700;
    margin: 18px 0;
}

.example-title {
    color: #94a3b8;
    font-size: 13px;
    margin-bottom: 6px;
}

.example {
    background: #0b1220;
    border-left: 3px solid #22c55e;
    padding: 12px;
    border-radius: 8px;
    line-height: 1.6;
}

.example-ko {

    margin-top: 6px;
    font-size: 14px;

/* =========================
   MOBILE
========================= */

@media(max-width:480px) {

    h1 {
        font-size: 21px;
    }

    .reader {
        font-size: 23px;
        padding: 16px;
    }

    .side-menu {
        width: 82vw;
    }

}

</style>

</head>

/* =========================
   MENU
========================= */

function openMenu() {

    $("sideMenu")
        .classList
        .add("show");

    $("menuOverlay")
        .classList
        .add("show");

}


function closeMenu() {

    $("sideMenu")
        .classList
        .remove("show");

    $("menuOverlay")
        .classList
        .remove("show");

}


$("menuButton").onclick =
    openMenu;


$("menuOverlay").onclick =
    closeMenu;



/* =========================
   PAGE SWITCH
========================= */

function showPage(page) {

    $("currentPage")
        .classList
        .remove("active");

    $("storagePage")
        .classList
        .remove("active");


    $("menuCurrent")
        .classList
        .remove("active");

    $("menuStorage")
        .classList
        .remove("active");


    if (page === "current") {

        $("currentPage")
            .classList
            .add("active");

        $("menuCurrent")
            .classList
            .add("active");

    }

    else {

        $("storagePage")
            .classList
            .add("active");

        $("menuStorage")
            .classList
            .add("active");

        renderStorage();

    }


    closeMenu();

}


$("menuCurrent").onclick =
    () => showPage("current");


$("menuStorage").onclick =
    () => showPage("storage");



/* =========================
   STORAGE
========================= */

function getSavedSentences() {

    try {

        return JSON.parse(
            localStorage.getItem(
                "kictcSentences"
            )
        ) || [];

    }

    catch {

        return [];

    }

}


function saveSentences(data) {

    localStorage.setItem(
        "kictcSentences",
        JSON.stringify(data)
    );

}



/* =========================
   SAVE SENTENCE
========================= */

$("saveSentence").onclick =
    () => {


        const sentence =
            $("text")
                .value
                .trim();


        if (!sentence) {

            $("status").textContent =
                "저장할 문장이 없습니다.";

            return;

        }


        if (sentence.length > 500) {

            $("status").textContent =
                "문장은 최대 500자까지 저장할 수 있습니다.";

            return;

        }


        const saved =
            getSavedSentences();


        /*
           같은 문장 중복 저장 방지
        */

        if (
            saved.some(
                item =>
                    item.text === sentence
            )
        ) {

            $("status").textContent =
                "이미 저장된 문장입니다.";

            return;

        }


        saved.unshift({

            id:
                Date.now(),

            text:
                sentence,

            created:
                new Date()
                    .toLocaleString()

        });


        saveSentences(
            saved
        );


        $("saveSentence")
            .classList
            .add("saved");


        $("saveSentence")
            .textContent =
            "✓ 저장되었습니다";


        $("status").textContent =
            "문장이 저장되었습니다.";

    };



/* =========================
   STORAGE RENDER
========================= */

function renderStorage() {


    const list =
        $("sentenceList");


    const saved =
        getSavedSentences();


    if (!saved.length) {

        list.innerHTML = `

            <div class="empty">

                📚 아직 저장된 문장이 없습니다.

                <br><br>

                현재 페이지에서
                <b>⭐ 이 문장 저장</b>을 눌러보세요.

            </div>

        `;

        return;

    }


    list.innerHTML = "";


    saved.forEach(
        (item, index) => {


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "sentence-card";


            const sentence =
                document.createElement(
                    "div"
                );


            sentence.className =
                "sentence-text";


            sentence.textContent =
                item.text;


            const buttons =
                document.createElement(
                    "div"
                );


            buttons.className =
                "sentence-buttons";


            const loadButton =
                document.createElement(
                    "button"
                );


            loadButton.className =
                "green";


            loadButton.textContent =
                "▶︎ 불러오기";


            loadButton.onclick =
                () => {

                    loadSentence(
                        item.text
                    );

                };


            const deleteButton =
                document.createElement(
                    "button"
                );


            deleteButton.className =
                "dark";


            deleteButton.textContent =
                "🗑️ 삭제";


            deleteButton.onclick =
                () => {

                    deleteSentence(
                        index
                    );

                };


            buttons.appendChild(
                loadButton
            );


            buttons.appendChild(
                deleteButton
            );


            card.appendChild(
                sentence
            );


            card.appendChild(
                buttons
            );


            list.appendChild(
                card
            );

        }
    );

}



/* =========================
   LOAD SENTENCE
========================= */

function loadSentence(
    sentence
) {


    showPage(
        "current"
    );


    $("text").value =
        sentence;


    updateCharacterCount();


    buildReader();


    $("status").textContent =
        "저장된 문장을 불러왔습니다.";

}



/* =========================
   DELETE SENTENCE
========================= */

function deleteSentence(
    index
) {


    const saved =
        getSavedSentences();


    saved.splice(
        index,
        1
    );


    saveSentences(
        saved
    );


    renderStorage();

}



/* =========================
   CHARACTER COUNT
========================= */

function updateCharacterCount() {


    const length =
        $("text")
            .value
            .length;


    $("charCount")
        .textContent =
        `${length} / 500`;


    $("charCount")
        .classList
        .remove(
            "warning",
            "error"
        );


    if (
        length >= 450 &&
        length <= 500
    ) {

        $("charCount")
            .classList
            .add(
                "warning"
            );

    }


    if (
        length > 500
    ) {

        $("charCount")
            .classList
            .add(
                "error"
            );

    }

}



/* =========================
   INPUT VALIDATION
========================= */

function isUnsafeText(
    text
) {


    const lower =
        text.toLowerCase();


    const dangerousPatterns = [

        "<script",

        "</script",

        "<html",

        "</html",

        "<body",

        "</body",

        "<style",

        "</style",

        "<iframe",

        "javascript:",

        "data:text/html",

        "onclick=",

        "onerror=",

        "onload="

    ];


    return dangerousPatterns.some(
        pattern =>
            lower.includes(
                pattern
            )
    );

}


function cleanText(
    text
) {


    /*
       HTML 태그 제거
    */

    text =
        text.replace(
            /<[^>]*>/g,
            " "
        );


    /*
       여러 공백 정리
    */

    text =
        text.replace(
            /\s+/g,
            " "
        )
        .trim();


    return text;

}



/* =========================
   TEXT INPUT
========================= */

$("text").oninput =
    () => {


        /*
           textarea 자체도
           500자 제한
        */

        if (
            $("text")
                .value
                .length > 500
        ) {

            $("text").value =
                $("text")
                    .value
                    .slice(
                        0,
                        500
                    );

        }


        speechSynthesis.cancel();


        resetPlaybackState();


        buildReader();


        updateCharacterCount();


        $("status").textContent =
            "준비됨";

/* =========================
   CLIPBOARD
========================= */

$("pasteText").onclick =
    async () => {


        try {


            if (
                !navigator.clipboard ||
                !navigator.clipboard.readText
            ) {

                throw new Error(
                    "Clipboard unavailable"
                );

            }


            let text =
                await navigator
                    .clipboard
                    .readText();


            /*
               500자 검사
            */

            if (
                text.length > 500
            ) {

                $("status").textContent =
                    `⚠️ 문장이 너무 깁니다. ${text.length}자입니다. 최대 500자까지 입력할 수 있습니다.`;

                return;

            }


            /*
               HTML / 코드 검사
            */

            if (
                isUnsafeText(
                    text
                )
            ) {

                $("status").textContent =
                    "⚠️ HTML 또는 코드 형태의 내용은 붙여넣을 수 없습니다.";

                return;

            }


            /*
               HTML 태그 제거
            */

            text =
                cleanText(
                    text
                );


            if (!text) {

                $("status").textContent =
                    "⚠️ 붙여넣을 수 있는 문장이 없습니다.";

                return;

            }


            if (
                text.length > 500
            ) {

                $("status").textContent =
                    "⚠️ 정리 후에도 문장이 500자를 초과합니다.";

                return;

            }


            speechSynthesis.cancel();


            resetPlaybackState();


            $("text").value =
                text;


            buildReader();


            updateCharacterCount();


            $("status").textContent =
                "📋 문장을 붙여넣었습니다.";

        }


        catch(error) {

            $("status").textContent =
                "⚠️ Chrome에서 클립보드 접근을 허용해주세요.";

        }

    };

/* =========================
   ESCAPE
========================= */

function escapeHTML(
    str
) {

    return str.replace(
        /[&<>"']/g,

        c => ({

            "&":
                "&amp;",

            "<":
                "&lt;",

            ">":
                "&gt;",

            '"':
                "&quot;",

            "'":
                "&#39;"

        }[c])

    );

}



/* =========================
   BUILD READER
========================= */

function buildReader() {


    speechSynthesis.cancel();


    clearInterval(
        timer
    );


    const text =
        $("text")
            .value;


    const regex =
        /\S+/g;


    let match;

    let last = 0;

    let output = "";


    words = [];

    bounds = [];


    while (
        (match =
            regex.exec(text))
    ) {


        output +=
            escapeHTML(
                text.slice(
                    last,
                    match.index
                )
            );


        const index =
            words.length;


        words.push(
            match[0]
        );


        bounds.push([

            match.index,

            match.index +
            match[0].length

        ]);


        output +=

            `<span
            class="word"
            data-index="${index}"
            onclick="speakWord(${index})">

            ${escapeHTML(
                match[0]
            )}

            </span>`;


        last =
            match.index +
            match[0].length;

    }


    output +=
        escapeHTML(
            text.slice(last)
        );


    $("reader")
        .innerHTML =
        output;

}



/* =========================
   PLAYBACK STATE
========================= */

function resetPlaybackState() {


    clearInterval(
        timer
    );


    clearTimeout(
        boundaryWatch
    );


    fallbackIndex =
        0;


    boundaryReceived =
        false;


    fallbackStarted =
        false;


    pausedByUser =
        false;

}



/* =========================
   FIND WORD
========================= */

function findWordFromCharacter(
    charIndex
) {


    for (
        let i = 0;
        i < bounds.length;
        i++
    ) {


        if (

            charIndex >=
            bounds[i][0]

            &&

            charIndex <
            bounds[i][1]

        ) {

            return i;

        }

    }


    return -1;

}



/* =========================
   HIGHLIGHT
========================= */

function highlightWord(
    index
) {


    if (
        index < 0 ||
        index >= words.length
    ) {

        return;

    }


    document
        .querySelectorAll(
            ".word"
        )
        .forEach(
            (element, i) => {


                element.classList.toggle(
                    "done",
                    i < index
                );


                element.classList.toggle(
                    "current",
                    i === index
                );


                if (
                    i !== index
                ) {

                    element.classList.remove(
                        "clicked"
                    );

                }

            }
        );


    $("status")
        .textContent =
        "▶︎ " +
        words[index];

}



/* =========================
   FALLBACK
========================= */

function startFallback() {


    if (
        fallbackStarted ||
        boundaryReceived
    ) {

        return;

    }


    fallbackStarted =
        true;


    clearInterval(
        timer
    );


    const interval =
        Math.max(

            90,

            Math.round(
                360 /
                Number(
                    $("speed")
                        .value
                )
            )

        );


    timer =
        setInterval(
            () => {


                if (

                    pausedByUser ||

                    speechSynthesis.paused

                ) {

                    return;

                }


                if (
                    !speechSynthesis.speaking
                ) {

                    clearInterval(
                        timer
                    );

                    return;

                }


                if (
                    fallbackIndex <
                    words.length
                ) {


                    highlightWord(
                        fallbackIndex
                    );


                    fallbackIndex++;

                }


            },

            interval

        );

}



/* =========================
   SPEAK WORD
========================= */

function speakWord(
    index
) {


    const word =
        words[index];


    if (!word) {

        return;

    }


    speechSynthesis.cancel();


    clearInterval(
        timer
    );


    openWordInfo(
        index
    );


    const u =
        new SpeechSynthesisUtterance(
            word
        );


    u.lang =
        "en-US";


    u.rate =
        0.72;


    u.onstart =
        () => {

            $("status")
                .textContent =
                "🔊 " +
                word;

        };


    u.onend =
        () => {

            $("status")
                .textContent =
                "✓ " +
                word;

        };


    speechSynthesis.speak(
        u
    );

}



/* =========================
   WORD INFO
========================= */

function openWordInfo(

) {


    const word =

    selectedWord =

    }


    $("wordModal")
        .classList
        .add("show");

}



/* =========================
   SENTENCE SPEAK
========================= */

function startSpeaking() {


    speechSynthesis.cancel();


    resetPlaybackState();


    buildReader();


    const text =
        $("text")
            .value
            .trim();


    if (!text) {

        $("status")
            .textContent =
            "문장을 입력해주세요.";

        return;

    }


    utterance =
        new SpeechSynthesisUtterance(
            text
        );


    utterance.lang =
        "en-US";


    utterance.rate =
        Number(
            $("speed")
                .value
        );


    utterance.onstart =
        () => {


            $("status")
                .textContent =
                "재생 중…";


            boundaryWatch =
                setTimeout(
                    () => {


                        if (

                            speechSynthesis.speaking

                            &&

                            !speechSynthesis.paused

                            &&

                            !boundaryReceived

                        ) {

                            startFallback();

                        }

                    },

                    800

                );

        };


    utterance.onboundary =
        event => {


            boundaryReceived =
                true;


            clearInterval(
                timer
            );


            clearTimeout(
                boundaryWatch
            );


            if (
                typeof event.charIndex ===
                "number"
            ) {


                const index =
                    findWordFromCharacter(
                        event.charIndex
                    );


                if (
                    index >= 0
                ) {


                    fallbackIndex =
                        index + 1;


                    highlightWord(
                        index
                    );

                }

            }

        };


    utterance.onpause =
        () => {


            pausedByUser =
                true;


            clearInterval(
                timer
            );


            $("status")
                .textContent =
                "Ⅱ 일시정지";

        };


    utterance.onresume =
        () => {


            pausedByUser =
                false;


            $("status")
                .textContent =
                "재생 중…";


            if (

                !boundaryReceived

                &&

                !fallbackStarted

            ) {

                startFallback();

            }

        };


    utterance.onend =
        () => {


            clearInterval(
                timer
            );


            clearTimeout(
                boundaryWatch
            );


            document
                .querySelectorAll(
                    ".word"
                )
                .forEach(
                    element => {

                        element.classList.remove(
                            "current"
                        );

                        element.classList.add(
                            "done"
                        );

                    }
                );


            $("status")
                .textContent =
                "완료";

        };


    utterance.onerror =
        () => {


            clearInterval(
                timer
            );


            $("status")
                .textContent =
                "음성 재생 오류";

        };


    speechSynthesis.speak(
        utterance
    );

}
